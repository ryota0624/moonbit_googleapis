name: Generate API clients (local)

on:
  push:
    branches:
      - _actrun_generate

jobs:
  generate:
    runs-on: self-hosted
    env:
      APIS: "drive:v3 storage:v1 firestore:v1 pubsub:v1 cloudtasks:v2 cloudscheduler:v1 logging:v2 cloudtrace:v2 clouderrorreporting:v1beta1 monitoring:v3 bigquery:v2"
      STREAMING_APIS: "firestore:google.firestore.v1 pubsub:google.pubsub.v1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build proto image
        run: |
          cd googleapis
          buf build . --exclude-path preview --output json -o /tmp/googleapis-image.json

      - name: Generate all API clients
        run: |
          for entry in $APIS; do
            api="${entry%%:*}"
            version="${entry##*:}"
            echo "=== Generating $api ($version) ==="
            curl -sS -o "/tmp/${api}.json" "https://www.googleapis.com/discovery/v1/apis/${api}/${version}/rest"

            STREAMING_FLAG=""
            for sentry in $STREAMING_APIS; do
              sapi="${sentry%%:*}"
              sproto="${sentry##*:}"
              if [ "$api" = "$sapi" ]; then
                ./scripts/extract_streaming.sh "$sproto" "/tmp/${api}_streaming.json"
                STREAMING_FLAG="--server-streaming /tmp/${api}_streaming.json"
                break
              fi
            done

            moon run discovery/ --target native -- "/tmp/${api}.json" --output "generated/${api}" $STREAMING_FLAG
            moon fmt "generated/${api}"
          done

      - name: Update interfaces
        run: moon info

      - name: Check compilation
        run: moon check

      - name: Run tests
        run: moon test
