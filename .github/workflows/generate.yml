name: Generate API clients

on:
  workflow_dispatch:
  push:
    branches:
      - _actrun_generate

jobs:
  generate:
    runs-on: self-hosted
    env:
      # Proto-based APIs. Entries are "<output_dir>:<proto_package>:<proto_path>".
      # proto_path is the subtree under googleapis/ that buf builds into a
      # per-package JSON image. Keeping images per-package avoids the
      # non-UTF8 bytes issue present in the combined googleapis-image.json.
      PROTO_APIS: >-
        firestore:google.firestore.v1:google/firestore/v1
        pubsub:google.pubsub.v1:google/pubsub/v1
        cloudtasks:google.cloud.tasks.v2:google/cloud/tasks/v2
        cloudscheduler:google.cloud.scheduler.v1:google/cloud/scheduler/v1
        logging:google.logging.v2:google/logging/v2
        cloudtrace:google.devtools.cloudtrace.v2:google/devtools/cloudtrace/v2
        clouderrorreporting:google.devtools.clouderrorreporting.v1beta1:google/devtools/clouderrorreporting/v1beta1
        monitoring:google.monitoring.v3:google/monitoring/v3
        bigquery:google.cloud.bigquery.storage.v1:google/cloud/bigquery/storage/v1
      # Discovery-based APIs. Entries are "<output_dir>:<discovery_url>".
      # Used for APIs whose google.api.http annotations are missing from
      # the proto definitions (e.g. Cloud Storage).
      DISCOVERY_APIS: >-
        storage:https://www.googleapis.com/discovery/v1/apis/storage/v1/rest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install buf CLI
        uses: bufbuild/buf-setup-action@v1

      - name: Generate proto-based API clients
        run: |
          set -euo pipefail
          for entry in $PROTO_APIS; do
            api="${entry%%:*}"
            rest="${entry#*:}"
            proto_pkg="${rest%%:*}"
            proto_path="${rest#*:}"

            echo "=== Generating $api ($proto_pkg from $proto_path) ==="
            image_path="/tmp/${api}-image.json"

            (cd googleapis && buf build . --path "$proto_path" --output json -o "$image_path")

            moon run codegen/ --target native -- \
              "$proto_pkg" \
              --image "$image_path" \
              --output "generated/${api}"
            moon fmt "generated/${api}"
          done

      - name: Generate Discovery-based API clients
        run: |
          set -euo pipefail
          for entry in $DISCOVERY_APIS; do
            api="${entry%%:*}"
            url="${entry#*:}"

            echo "=== Generating $api from Discovery: $url ==="
            doc_path="/tmp/${api}-discovery.json"

            curl -sSL -o "$doc_path" "$url"

            moon run codegen/ --target native -- \
              --image "$doc_path" \
              --output "generated/${api}"
            moon fmt "generated/${api}"
          done

      - name: Update interfaces
        run: moon info

      - name: Check compilation
        run: moon check --target native

      - name: Run tests
        run: moon test
