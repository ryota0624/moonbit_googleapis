name: Generate API clients

on:
  workflow_dispatch:

env:
  APIS: >-
    drive:v3
    storage:v1
    firestore:v1
    pubsub:v1
    cloudtasks:v2
    cloudscheduler:v1
    logging:v2
    cloudtrace:v2
    clouderrorreporting:v1beta1
    monitoring:v3
    bigquery:v2

jobs:
  generate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Generate all API clients
        run: |
          for entry in $APIS; do
            api="${entry%%:*}"
            version="${entry##*:}"
            echo "=== Generating $api ($version) ==="
            curl -sS -o "/tmp/${api}.json" "https://www.googleapis.com/discovery/v1/apis/${api}/${version}/rest"
            moon run discovery/ --target native -- "/tmp/${api}.json" --output "generated/${api}"
            moon fmt "generated/${api}"
          done

      - name: Update interfaces
        run: moon info

      - name: Check compilation
        run: moon check

      - name: Run tests
        run: moon test
